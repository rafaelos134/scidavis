name: CI Tests

on: [pull_request,push]

env:
  QT_VERSION: '6.8.*'   # current Qt LTS

jobs:
  Ubuntu:

    runs-on: ubuntu-24.04

    name: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libmuparser-dev \
            libgsl-dev \
            libgtest-dev \
            zlib1g-dev \
            xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configuring
        run: |
          cmake -S . -B build -G Ninja -DSEARCH_FOR_UPDATES=OFF -DDOWNLOAD_LINKS=OFF \
            -DORIGIN_IMPORT=ON -DBUILD_TESTS=ON

      - name: Building
        run: |
          cmake --build build -j$(nproc)

      - name: Testing
        run: |
          cd build
          xvfb-run ctest --output-on-failure

  MSVC:

    runs-on: windows-latest

    name: MSVC

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install VCPKG packages
        run: |
          vcpkg install zlib gsl muparser gl2ps gtest --triplet x64-windows

      - name: Configuring
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DORIGIN_IMPORT=ON -DBUILD_TESTS=ON

      - name: Building
        run: |
          cmake --build build --config Release -- -maxCpuCount

      - name: Testing
        run: |
          cd build
          ctest -C Release --output-on-failure

  MinGW-w64:

    runs-on: windows-latest

    name: MinGW-w64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install MinGW-w64 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-muparser
            mingw-w64-ucrt-x86_64-gsl
            mingw-w64-ucrt-x86_64-gl2ps
            mingw-w64-ucrt-x86_64-gtest

      - name: Configuring
        run: |
          cmake -S . -B build -G Ninja -DORIGIN_IMPORT=ON -DBUILD_TESTS=ON

      - name: Building
        run: |
          cmake --build build -j$(nproc)

      - name: Testing
        run: |
          cd build
          ctest --output-on-failure

  macos:

    runs-on: macos-latest

    name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install prerequisites
        run: |
          brew install muparser gsl gl2ps googletest

      - name: Configuring
        run: |
          cmake -S . -B build -DORIGIN_IMPORT=ON -DBUILD_TESTS=ON

      - name: Building
        run: |
          cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Testing
        run: |
          cd build
          ctest --output-on-failure
